[project]
name = "scrapper"
version = "0.1.0"
description = "Resumable domain crawler that stores pages on disk or in SQLite"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.21.0",
    "beautifulsoup4>=4.15.0",
    "html2text>=2025.4.15",
    "httpx>=0.28.0",
    "lxml>=6.0.0",
    "playwright>=1.62.0",
    "trafilatura>=2.0.0",
    "chromadb>=1.0.0",
    "qdrant-client>=1.14.0",
    "pyyaml>=6.0.0",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.8.0",
    "openai>=1.0.0",
    "sentence-transformers>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crawler", "rag"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
